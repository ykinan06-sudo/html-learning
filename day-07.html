<!DOCTYPE html>
<html lang="en">
  <head>
<title>Day 07</title>
  </head>
  <body>
    <table border="1" bgcolor="lightblue" align="center" height="200" width="200">
      <caption>My Table</caption>
      <colgroup>
        <col span="3" style="background-color:yellow">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Nick name</th>
          <th scope="col">Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th colspan="2" scope="row">John</td>
          <td scope="row">30</td>
        </tr>
        <tr>
          <th scope="row">Jane</td>
          <td >Mana</td>
          <td >25</td>
        </tr>
      </tbody>
    </table>

  </body>
</html>
