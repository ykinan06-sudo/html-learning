<!DOCTYPE html>
<html>
  <head>
<title>Form</title>
  </head>
  <body>
    <h2>Complete the Form</h2>
    <form>
      <div>
      <label for="Firstname">First name:</label>
      <input type="text" name="firstname" id="firstname"> 
      </div>  <br>
       <div>
      <label for="Lastname">Last name:</label>
      <input type="text" name="lastname" id="lastname"> 
      </div>  <br>
       <div>
      <label for="email">Email:</label>
      <input type="email" name="email" id="email"> 
      </div>  <br>
       <div>
      <label for="password">Password:</label>
      <input type="password" name="password" id="password"> 
      </div>  <br>
       <div>
      <label for="dob">Date of Birth:</label>
      <input type="date" name="dob" id="dob"> 
      </div>  <br>
       <div>
      <label for="blood">Blood Group:</label>
      <input type="radio" name="blood" id="blood"> A+
      <input type="radio" name="blood" id="blood"> A-
      <input type="radio" name="blood" id="blood"> B+
      <input type="radio" name="blood" id="blood"> B-
      <input type="radio" name="blood" id="blood"> AB+
      <input type="radio" name="blood" id="blood"> AB-
      <input type="radio" name="blood" id="blood"> O+
      <input type="radio" name="blood" id="blood"> O-
      </div>  <br>
      <div>
      <label for="photo">Chose your photo:</label>
      <input type="file" name="photo" id="photo"> 
      </div>  <br>
      <div>
      <label for="gender">Gender:</label>
      <input type="radio" name="gender" id="male" value="male"> Male
      <input type="radio" name="gender" id="female" value="female"> Female
      </div>  <br>
      <div>
        <lable for="department">Department:</lable>
        <select>
           <option value="cse">CSE</option>
           <option value="eee">EEE</option>
            <option value="bba">BBA</option>
        </select>
      </div>  <br>
      <div>
        <lable for="message">Message:</lable><br>
        <textarea col="30" row="10"></textarea>
      </div> 
      <div>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
      </div>
    </form>

  </body>
</html>
